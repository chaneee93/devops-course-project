server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — 파일이 없으면 무조건 index.html을 줌.
    # /courses 같은 주소를 새로고침해도 404 대신 index.html → React Router가 처리.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 정적 자산은 오래 캐싱
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
