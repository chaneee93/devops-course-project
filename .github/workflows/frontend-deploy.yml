name: Frontend Deploy

# 언제 실행? — main에 frontend 코드가 push되면 (+ 수동 실행 버튼)
on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-deploy.yml'
  workflow_dispatch:

env:
  IMAGE_NAME: chaneee93/course-frontend

jobs:
  # ── 로컬용: Docker Hub에 Nginx 이미지 빌드 & 푸시 ──
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@v3

      - name: Docker Hub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 이미지 빌드 & 푸시 (frontend/Dockerfile 사용)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  # ── AWS용: S3 sync + CloudFront 무효화 (준비만) ──
  # 활성화: 저장소 Settings → Variables에 DEPLOY_AWS=true 추가 (AWS 리소스 생성 후)
  deploy-aws:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: ${{ vars.DEPLOY_AWS == 'true' }}
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Node 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 프론트 빌드
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

      - name: AWS 자격증명 (OIDC — 키 없이 인증)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: S3에 빌드 결과 동기화
        run: aws s3 sync ./frontend/dist s3://${{ vars.S3_BUCKET }} --delete

      - name: CloudFront 캐시 무효화
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
