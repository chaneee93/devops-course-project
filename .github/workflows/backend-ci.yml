name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

env:
  IMAGE_NAME: chaneee93/course-backend

jobs:
  build-test-push:
    runs-on: ubuntu-latest

    # 테스트용 임시 MySQL + Redis (워크플로우 안에서만 뜸)
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: course_db
          MYSQL_USER: course_user
          MYSQL_PASSWORD: course_pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s --health-timeout=5s --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s --health-timeout=5s --health-retries=10

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: JDK 17 설정
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 빌드 + 테스트 (임시 MySQL/Redis 상대로)
        working-directory: ./backend
        run: ./gradlew test --no-daemon

      - name: Docker Hub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 이미지 빌드 & 푸시 (backend/Dockerfile)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  # ── K8s 배포는 GitHub 서버가 로컬 minikube에 못 닿으므로 수동/로컬 ──
  # 로컬에서: kubectl apply -k k8s/overlays/local  (M7-4에서 매니페스트 작성)
