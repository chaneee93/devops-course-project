apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: course-backend
spec:
  ingressClassName: nginx
  # TLS 종료 — 자체 서명 인증서(Secret)로 HTTPS 처리
  tls:
    - hosts:
        - course.local
      secretName: course-backend-tls
  rules:
    - host: course.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: course-backend
                port:
                  number: 8080
