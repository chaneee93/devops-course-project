apiVersion: apps/v1
kind: Deployment
metadata:
  name: course-backend
spec:
  # replicas는 HPA가 관리하므로 명시 안 함
  selector:
    matchLabels:
      app: course-backend
  template:
    metadata:
      labels:
        app: course-backend
    spec:
      containers:
        - name: backend
          image: chaneee93/course-backend:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: course-backend-config
            - secretRef:
                name: course-backend-secret
          # ★ HPA가 CPU 사용률(%)을 계산하려면 requests가 필요
          resources:
            requests:
              cpu: "200m"
              memory: "320Mi"
            limits:
              cpu: "500m"
              memory: "600Mi"
          startupProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8080 }
            periodSeconds: 10
