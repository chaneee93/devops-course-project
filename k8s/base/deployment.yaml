apiVersion: apps/v1
kind: Deployment
metadata:
  name: course-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: course-backend
  template:
    metadata:
      labels:
        app: course-backend
    spec:
      containers:
        - name: backend
          image: chaneee93/course-backend:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: course-backend-config
            - secretRef:
                name: course-backend-secret
          # startup: 느린 초기 구동 보호 (최대 5s*30=150s 대기)
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            failureThreshold: 30
            periodSeconds: 5
          # liveness: 죽으면 재시작
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 10
          # readiness: 준비 안 되면 트래픽 차단
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 10
