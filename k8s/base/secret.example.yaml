# 실제 Secret은 git에 커밋하지 않는다 (base64는 암호화가 아니므로).
# 아래 명령으로 클러스터에 직접 생성:
#   kubectl create secret generic course-backend-secret \
#     --from-literal=DB_USER=course_user \
#     --from-literal=DB_PASSWORD=<실제비번>
#
# AWS 전환 시: RDS의 계정/비번으로 동일하게 생성 (매니페스트 변경 불필요)
apiVersion: v1
kind: Secret
metadata:
  name: course-backend-secret
type: Opaque
stringData:
  DB_USER: "<채워넣기>"
  DB_PASSWORD: "<채워넣기>"
